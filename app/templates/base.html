<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Results Management System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if session.get('user') %}
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Results Management System</a>
    <nav>
      <a href="{{ url_for('students') }}">Students</a>
      <a href="{{ url_for('courses') }}">Courses</a>
      <a href="{{ url_for('results') }}">Results</a>
    </nav>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="linklike" type="submit">Sign out</button>
    </form>
  </header>
  {% endif %}

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
